name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest
        run: pytest -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspaces
        run: npm install
      - name: Lint web
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck
      - name: Studio tests
        working-directory: apps/web
        run: npm run test:studio
      - name: CRM Postgres client audit
        working-directory: apps/web
        run: npm run audit:pg-clients
      - name: Contact Profile v2 artifact guard
        working-directory: apps/web
        run: npm run verify:crm-profile-v2
      - name: Checkout Titanium Guardian (CRM pg contract parity)
        uses: actions/checkout@v4
        with:
          repository: rob345-oss/senior-cybersecurity-346
          path: senior-cybersecurity-346
      - name: CRM pg contract parity (Titanium Guardian)
        working-directory: apps/web
        env:
          TG_FRONTEND_ROOT: ${{ github.workspace }}/senior-cybersecurity-346/frontend
        run: npm run verify:crm-pg-parity
      - name: Build web
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Contact Profile v2 build artifact guard
        working-directory: apps/web
        env:
          CRM_PROFILE_V2_REQUIRE_BUILD: "1"
        run: npm run verify:crm-profile-v2

  crm-pg-staging-integration:
    name: CRM live PostgreSQL probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspaces
        run: npm install
      - name: CRM Postgres TLS integration probe
        working-directory: apps/web
        env:
          CRM_DATABASE_URL: ${{ secrets.CRM_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$CRM_DATABASE_URL" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::notice title=CRM DB probe::Skipped on pull_request — CRM_DATABASE_URL not available to workflow"
              echo "probe_result=skipped" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::CRM_DATABASE_URL is required for pushes to protected branches"
            exit 1
          fi
          npm run probe:crm-pg
          echo "probe_result=passed" >> "$GITHUB_STEP_SUMMARY"
