name: CRM Staging Release Gates

on:
  workflow_dispatch:
  push:
    branches: [develop, main]

concurrency:
  group: crm-staging-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  crm-staging-release-gates:
    name: CRM staging release gates (required)
    runs-on: ubuntu-latest
    environment: crm-staging-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces
        run: npm install

      - name: CRM reliability unit tests
        working-directory: apps/web
        run: npm run test:crm-reliability

      - name: CRM Postgres client audit
        working-directory: apps/web
        run: npm run audit:pg-clients

      - name: Require CRM_DATABASE_URL (staging)
        env:
          CRM_DATABASE_URL: ${{ secrets.CRM_DATABASE_URL }}
        run: |
          if [ -z "$CRM_DATABASE_URL" ]; then
            echo "::error::CRM_DATABASE_URL is required in GitHub environment crm-staging-release"
            exit 1
          fi

      - name: Live PostgreSQL TLS integration probe
        working-directory: apps/web
        env:
          CRM_DATABASE_URL: ${{ secrets.CRM_DATABASE_URL }}
        run: npm run probe:crm-pg

      - name: Checkout Titanium Guardian (contract parity)
        uses: actions/checkout@v4
        with:
          repository: rob345-oss/senior-cybersecurity-346
          path: senior-cybersecurity-346

      - name: CRM pg contract parity
        working-directory: apps/web
        env:
          TG_FRONTEND_ROOT: ${{ github.workspace }}/senior-cybersecurity-346/frontend
        run: npm run verify:crm-pg-parity